<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contagem regressiva · Black Friday</title>
<meta name="description" content="Quantos dias faltam para a Black Friday.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap">
<style>
  /* Tema: troque as cores aqui */
  :root {
    --bg: #0a0a0a;
    --fg: #f3efe6;
    --yellow: #ffd60a;
    --blue: #1d4ed8;
    --card: #151515;
    --muted: #8f897b;
    --pad: clamp(16px, 4vw, 56px);
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    overflow-x: clip;
    -webkit-font-smoothing: antialiased;
  }

  .nl-wrap { display: none !important; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: clamp(40px, 6vw, 72px) var(--pad) 24px;
  }
  /* O SVG do site tem letras pretas. Duas cópias sobrepostas: uma branqueada (só as letras, 87,5% da direita)
     e a original recortada no "e" vermelho (12,5% da esquerda). */
  .logo { position: relative; }
  .logo img { display: block; height: clamp(18px, 2.2vw, 26px); width: auto; }
  .logo img:first-child { filter: brightness(0) invert(1); clip-path: inset(0 0 0 12.5%); }
  .logo img:last-child { position: absolute; inset: 0; clip-path: inset(0 87.5% 0 0); }
  .today { color: #fff; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; text-align: right; }

  main {
    flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 24px var(--pad) 72px;
    display: flex; flex-direction: column; justify-content: center;
  }

  .hero { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: clamp(24px, 4vw, 56px); }
  .hero > :not(.cross) { position: relative; z-index: 2; }
  .hero > .side { z-index: 1; }

  /* Duas fitas cruzadas em X atrás do placar */
  .cross { --angle: 9deg; position: absolute; top: 0; bottom: 0; left: 50%; width: 100vw; translate: -50%; overflow-x: clip; }
  .cross .marquee { position: absolute; top: 50%; left: 50%; width: 200vw; translate: -50% -50%; rotate: var(--angle); }
  .cross .marquee + .marquee { rotate: calc(var(--angle) * -1); }
  /* Luz fixa na fita: reflexo ao longo da largura + foco de luz à direita do cruzamento, escurecendo nas pontas */
  .cross .marquee::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, #fff0, #ffffff66 26%, #fff0 50%, #0000 68%, #00000030),
      linear-gradient(90deg, #00000066 26%, #0000 44%, #ffffff73 58%, #0000 70%, #00000066 76%);
  }
  .cross .marquee + .marquee .track { animation-direction: reverse; }
  @media (max-width: 700px) { .cross { --angle: 24deg; } }

  /* Textos ganham fundo preto para continuarem legíveis em cima das fitas */
  .eyebrow, .clock small { width: fit-content; background: var(--bg); box-shadow: 0 0 0 6px var(--bg); }
  /* Contorno preto feito com 16 sombras em círculo. Não usar -webkit-text-stroke + paint-order:
     navegadores antigos (ex.: TVs LG) ignoram paint-order no texto e o contorno cobre o preenchimento. */
  .title { color: #fff; text-shadow: 0.080em 0.000em 0 var(--bg), 0.074em 0.031em 0 var(--bg), 0.057em 0.057em 0 var(--bg), 0.031em 0.074em 0 var(--bg), 0.000em 0.080em 0 var(--bg), -0.031em 0.074em 0 var(--bg), -0.057em 0.057em 0 var(--bg), -0.074em 0.031em 0 var(--bg), -0.080em 0.000em 0 var(--bg), -0.074em -0.031em 0 var(--bg), -0.057em -0.057em 0 var(--bg), -0.031em -0.074em 0 var(--bg), -0.000em -0.080em 0 var(--bg), 0.031em -0.074em 0 var(--bg), 0.057em -0.057em 0 var(--bg), 0.074em -0.031em 0 var(--bg); }
  .eyebrow { margin-bottom: 14px; font-size: 13px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; }

  /* Placar split-flap */
  .board { position: relative; display: inline-block; font-size: clamp(7rem, 27vw, 20rem); }
  .flaps { display: flex; gap: .035em; }
  .flap {
    position: relative; width: .64em; height: 1.08em; background: var(--bg); border-radius: .05em;
    font-weight: 800; font-stretch: 75%; line-height: 1.08em; text-align: center;
  }
  .flap i {
    position: absolute; left: 0; right: 0; height: calc(50% - 1px); overflow: hidden;
    background: #fff; color: var(--bg); font-style: normal;
    backface-visibility: hidden;
  }
  .flap i::before { content: attr(data-c); position: absolute; left: 0; right: 0; height: 1.08em; }
  .flap .t, .flap .ft { top: 0; border-radius: .05em .05em 0 0; transform-origin: 50% 100%; }
  .flap .b, .flap .fb { bottom: 0; border-radius: 0 0 .05em .05em; transform-origin: 50% 0; }
  .flap .t::before, .flap .ft::before { top: 0; }
  .flap .b::before, .flap .fb::before { bottom: 0; }
  .flap .ft { transform: rotateX(-90deg); }

  /* Selo girando */
  .stamp {
    position: absolute; top: 0; right: 0; width: clamp(88px, .42em, 190px);
    translate: 70% -30%; rotate: 12deg;
  }
  .stamp text { fill: var(--bg); font-weight: 700; text-transform: uppercase; }
  .stamp .ring { transform-box: view-box; transform-origin: center; animation: spin 45s linear infinite; }
  .stamp .ring text { font-size: 15px; }
  .stamp .day { font-size: 78px; font-weight: 800; font-stretch: 75%; }
  .stamp .month { font-size: 19px; letter-spacing: .2em; }

  .side { min-width: 260px; }
  @media (max-width: 700px) { .side { text-align: center; } .clock { justify-content: center; } .clock small { margin-inline: auto; } }
  .title {
    font-size: clamp(2.75rem, 6.6vw, 6.25rem); font-weight: 800; font-stretch: 75%;
    line-height: .88; letter-spacing: -.01em; text-transform: uppercase;
  }
  .clock { display: flex; gap: 14px; margin-top: 28px; }
  .clock .flaps { font-size: 2.75rem; gap: 2px; }
  .clock small { display: block; margin-top: 6px; font-size: 11px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }

  /* Cards de faturamento */
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px;
    margin-top: clamp(56px, 7vw, 96px);
  }
  .card {
    background: var(--card); border-radius: 14px; border-bottom: 6px solid var(--blue);
    padding-top: 20px; overflow: hidden; rotate: var(--r);
  }
  .card h2 { display: flex; justify-content: space-between; padding: 0 20px; font-size: 15px; font-weight: 600; }
  .card h2 span { color: var(--blue); animation: rise 1.6s ease-in-out infinite; }
  .card p { padding: 4px 20px 8px; font-size: 1.9rem; font-weight: 800; }
  .card svg { display: block; width: 100%; animation: reveal 6s ease-in-out var(--d) infinite; }
  .line { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .area { fill: url(#fade); }

  /* Fita rolando */
  .marquee { overflow: hidden; padding: 12px 0; background: var(--yellow); color: var(--bg); }
  .track { display: flex; align-items: center; width: max-content; animation: marquee 90s linear infinite; }
  .track span { padding: 0 20px; font-size: clamp(1.5rem, 3.4vw, 2.75rem); font-weight: 800; font-stretch: 75%; text-transform: uppercase; }
  .track span:nth-child(even) { font-size: clamp(.7rem, 1.5vw, 1.2rem); }

  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes rise    { from { transform: translateY(4px); opacity: 0; } 50% { opacity: 1; } to { transform: translateY(-4px); opacity: 0; } }
  @keyframes reveal  { from { clip-path: inset(0 100% 0 0); } 55%, 88% { clip-path: inset(0); opacity: 1; } to { clip-path: inset(0); opacity: 0; } }
  @keyframes marquee { to { transform: translateX(-50%); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <!-- LOGO: carregada do site da etraction -->
  <div class="logo">
    <img src="https://etraction.com.br/wp-content/uploads/2021/02/Etraction-logo-1.svg" alt="etraction">
    <img src="https://etraction.com.br/wp-content/uploads/2021/02/Etraction-logo-1.svg" alt="" aria-hidden="true">
  </div>
  <p class="today" id="date"></p>
</header>

<main>
  <h1 class="sr" id="sr"></h1>

  <section class="hero" aria-hidden="true">
    <div class="cross">
      <div class="marquee"><div class="track"></div></div>
      <div class="marquee"><div class="track"></div></div>
    </div>
    <div>
      <p class="eyebrow" id="eyebrow">Faltam</p>
      <div class="board">
        <div class="flaps" id="days"></div>
        <svg class="stamp" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="97" fill="var(--yellow)" stroke="var(--bg)" stroke-width="6"/>
          <g class="ring">
            <path id="ring" fill="none" d="M100,100 m-76,0 a76,76 0 1,1 152,0 a76,76 0 1,1 -152,0"/>
            <text textLength="470"><textPath href="#ring" id="ringText"></textPath></text>
          </g>
          <text class="day" x="100" y="122" text-anchor="middle" id="stampDay"></text>
          <text class="month" x="103" y="146" text-anchor="middle" id="stampMonth"></text>
        </svg>
      </div>
    </div>

    <div class="side">
      <p class="title" id="title"></p>
      <div class="clock">
        <div><div class="flaps" id="h"></div><small>horas</small></div>
        <div><div class="flaps" id="m"></div><small>min</small></div>
        <div><div class="flaps" id="s"></div><small>seg</small></div>
      </div>
    </div>
  </section>

  <!-- Cards: valores ilustrativos. data-value = valor inicial, data-step = quanto sobe por ciclo, data-max = teto (ao chegar, volta ao inicial) -->
  <section class="cards" aria-hidden="true">
    <article class="card" style="--d: 0s; --r: -1.5deg" data-value="3092954.59" data-step="1900" data-max="10000000" data-currency>
      <h2>Faturamento Total <span>▲</span></h2><p></p>
      <svg viewBox="0 0 400 72"><path class="area"/><path class="line"/></svg>
    </article>
    <article class="card" style="--d: -2s; --r: 1deg" data-value="184320.10" data-step="640" data-max="1000000" data-currency>
      <h2>Faturamento Hoje <span>▲</span></h2><p></p>
      <svg viewBox="0 0 400 72"><path class="area"/><path class="line"/></svg>
    </article>
    <article class="card" style="--d: -4s; --r: -.75deg" data-value="12847" data-step="3" data-max="20000">
      <h2>Pedidos <span>▲</span></h2><p></p>
      <svg viewBox="0 0 400 72"><path class="area"/><path class="line"/></svg>
    </article>
  </section>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const animate = window.gsap && !matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Black Friday = dia seguinte à 4ª quinta-feira de novembro
  function blackFriday(year) {
    const firstWeekday = new Date(year, 10, 1).getDay();
    return new Date(year, 10, 1 + (4 - firstWeekday + 7) % 7 + 22);
  }
  console.assert([2024, 2025, 2026].map(y => blackFriday(y).getDate()).join() === '29,28,27', 'blackFriday quebrou');

  // Split-flap: .t/.b são as metades paradas, .ft/.fb as que giram.
  // Em repouso .ft fica de perfil (invisível) e .fb cobre .b com o mesmo caractere.
  function flip(flap, c, dur = .18) {
    if (flap.dataset.c === c) return;
    const [t, b, ft, fb] = flap.children;
    const old = flap.dataset.c;
    flap.tl?.progress(1);
    flap.dataset.c = c;
    if (!animate || old === undefined) {
      for (const half of flap.children) half.dataset.c = c;
      return;
    }
    ft.dataset.c = old;
    t.dataset.c = fb.dataset.c = c;
    flap.tl = gsap.timeline()
      .fromTo(ft, { rotationX: 0 }, { rotationX: -90, duration: dur, ease: 'power1.in' })
      .fromTo(fb, { rotationX: 90 }, { rotationX: 0, duration: dur, ease: 'power1.out' })
      .call(() => b.dataset.c = c);
  }

  function board(el, text) {
    if (el.children.length !== text.length) {
      el.innerHTML = '<span class="flap"><i class="t"></i><i class="b"></i><i class="ft"></i><i class="fb"></i></span>'.repeat(text.length);
      if (animate) gsap.set(el.querySelectorAll('.ft, .fb'), { transformPerspective: 600 });
    }
    [...text].forEach((c, i) => flip(el.children[i], c));
  }

  // Embaralha os dígitos dos dias e volta ao valor certo, como placar atualizando
  function shuffle(el) {
    [...el.children].forEach((flap, i) => {
      const final = flap.dataset.c;
      for (let k = 0; k < 6; k++) {
        gsap.delayedCall(i * .18 + k * .13, flip, [flap, k < 5 ? String((+final + k + 1) % 10) : final, .06]);
      }
    });
  }

  function tick() {
    const now = new Date();
    let bf = blackFriday(now.getFullYear());
    if (now - bf >= 864e5) bf = blackFriday(now.getFullYear() + 1); // já passou: mira no ano seguinte
    const ms = Math.max(0, bf - now);
    const days = Math.floor(ms / 864e5);
    const unit = days === 1 ? 'dia' : 'dias';

    board($('days'), String(days));
    board($('h'), pad(Math.floor(ms / 36e5) % 24));
    board($('m'), pad(Math.floor(ms / 6e4) % 60));
    board($('s'), pad(Math.floor(ms / 1e3) % 60));

    $('eyebrow').textContent = ms ? (days === 1 ? 'Falta' : 'Faltam') : 'Chegou';
    $('title').innerHTML = `${ms ? `${unit} para a` : 'É hoje!'}<br>Black Friday`;
    $('sr').textContent = ms ? `Faltam ${days} ${unit} para a Black Friday` : 'É hoje! Black Friday';
    $('date').textContent = bf.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('stampDay').textContent = bf.getDate();
    $('stampMonth').textContent = 'NOV';
    $('ringText').textContent = `Black Friday • ${bf.getFullYear()} • `.repeat(3);
  }
  tick();
  setInterval(tick, 1000);
  if (animate) setInterval(() => shuffle($('days')), 20000);

  // Gráfico: linha suave com tendência de alta + ruído, redesenhada a cada ciclo da animação
  function chart(svg) {
    const n = 12;
    const pts = Array.from({ length: n }, (_, i) => [
      i * 400 / (n - 1),
      Math.min(66, Math.max(6, 56 - i / (n - 1) * 38 + (Math.random() - .5) * 26)),
    ]);
    let d = `M${pts[0]}`;
    for (let i = 1; i < n - 1; i++) {
      d += ` Q${pts[i]} ${(pts[i][0] + pts[i + 1][0]) / 2},${(pts[i][1] + pts[i + 1][1]) / 2}`;
    }
    d += ` L${pts[n - 1]}`;
    svg.querySelector('.line').setAttribute('d', d);
    svg.querySelector('.area').setAttribute('d', d + ' L400,72 L0,72 Z');
  }

  document.querySelectorAll('.card').forEach(card => {
    const svg = card.querySelector('svg');
    const out = card.querySelector('p');
    const currency = 'currency' in card.dataset;
    const state = { value: +card.dataset.value };
    const show = () => out.textContent = currency
      ? state.value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
      : Math.round(state.value).toLocaleString('pt-BR');

    chart(svg);
    show();
    svg.addEventListener('animationiteration', () => chart(svg));
    // Valor rola suave até o próximo número; ao bater no teto (data-max), volta ao valor inicial
    const rise = () => {
      const max = +card.dataset.max || Infinity;
      if (state.value >= max) state.value = +card.dataset.value;
      gsap.to(state, {
        value: Math.min(max, state.value + card.dataset.step * (.4 + Math.random())),
        duration: 1.1, delay: .4, ease: 'power2.out', onUpdate: show, onComplete: rise,
      });
    };
    if (animate) rise();
  });

  for (const track of document.querySelectorAll('.track')) track.innerHTML = '<span>Black Friday</span><span>●</span>'.repeat(24);

  // Remove o selo "Powered by Netlify" (.nl-wrap), que a hospedagem injeta um tempo depois do carregamento.
  // Cobre o selo solto no body e o selo dentro de um shadow root aberto (aí remove o elemento hospedeiro).
  const dropBadge = () => {
    document.querySelectorAll('.nl-wrap').forEach(el => el.remove());
    for (const el of [...document.body.children, ...document.documentElement.children]) {
      if (el.shadowRoot?.querySelector('.nl-wrap')) el.remove();
    }
  };
  dropBadge();
  const badgeWatch = new MutationObserver(dropBadge);
  badgeWatch.observe(document.body, { childList: true });
  badgeWatch.observe(document.documentElement, { childList: true });

  // Entrada em cascata ao carregar
  if (animate) gsap.from('header, .eyebrow, .board, .side, .card', {
    y: 28, opacity: 0, duration: .8, stagger: .1, ease: 'power3.out',
  });
</script>
</body>
</html>
